<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonChexx Wiki</title>

<script>(function(){var c=["en", "ko", "es", "ja", "zh-hans", "zh-hant", "ar", "de", "fil", "fr", "hi", "id", "it", "pl", "pt", "ru", "th", "tr", "uk", "vi"];
function pick(tag){tag=(tag||"").toLowerCase();var two=tag.slice(0,2);
if(two==="zh"){return /(hant|tw|hk|mo)/.test(tag)?"zh-hant":"zh-hans";}
if(two==="tl"||tag.slice(0,3)==="fil"){return "fil";}return two;}
var saved=null;try{saved=localStorage.getItem("monchexx-wiki-language");}catch(e){}
if(saved&&c.indexOf(saved)>=0){location.replace(saved+"/");return;}
var l=navigator.languages||[navigator.language||""];
for(var i=0;i<l.length;i++){var p=pick(l[i]);if(c.indexOf(p)>=0){location.replace(p+"/");return;}}
location.replace("en/");})();</script>
